<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - RailReserve</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <nav class="navbar">

            <div class="logo">
                🚆 RailReserve
            </div>

            <a href="index.html" class="home-link">
                ← Back to Home
            </a>

        </nav>

    </header>


    <!-- Registration Section -->
    <main class="register-page">

        <div class="register-container">

            <!-- Header -->
            <div class="register-header">

                <div class="register-icon">
                    🚆
                </div>

                <h1>Create Account</h1>

                <p>
                    Create your RailReserve account
                </p>

            </div>


            <!-- Registration Form -->
            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Terms -->
                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the Terms and Conditions

                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="register-submit"
                >
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <div class="login-section">

                <p>
                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 RailReserve. All Rights Reserved.
        </p>

    </footer>


    <script src="register.js"></script>

</body>

</html>
