<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - RailReserve</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <nav class="navbar">

            <div class="logo">
                🚆 RailReserve
            </div>

            <a href="index.html" class="home-link">
                ← Back to Home
            </a>

        </nav>

    </header>


    <!-- Login Section -->
    <main class="login-section">

        <div class="login-container">

            <div class="login-header">

                <div class="login-icon">
                    🚆
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to manage your railway reservations
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Remember Me -->
                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <div class="register-section">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 RailReserve. All Rights Reserved.
        </p>

    </footer>


    <script src="login.js"></script>

</body>

</html>
